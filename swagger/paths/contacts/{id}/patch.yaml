tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: '668013b8ed2af274d0bb45eb'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Rosana'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '29-36-54'
          email:
            description: "Contact's email"
            type: string
            example: 'marco5@gmail.com'
          isFavourite:
            description: "Contact's favourite. Should be between 1 and 12"
            type: boolean
            example: false
          contactType:
            description: 'Contact type'
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            description: "Link to contact's photo"
            type: string
            example: 'https://res.cloudinary.com/dhybvac8i/image/upload/v1719908534/zvsgkozogtrkdwgtzaep.jpg'
responses:
  '200':
    description: Successfully updated contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
