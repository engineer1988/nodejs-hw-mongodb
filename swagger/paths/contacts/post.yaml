tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Rosana'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '29-36-54'
          email:
            description: "Contact's email"
            type: string
            example: 'marco5@gmail.com'
          isFavourite:
            description: "Contact's fauvorite. Should be between 1 and 12"
            type: boolean
            example: false
          contactType:
            description: 'Contact type'
            enum: ['work', 'home', 'personal']
            example: 'work'
          userId:
            description: "Contact's user id"
            type: string
            example: 667ecf3efd703971428b92e4
          photo:
            description: "Link to contact's photo"
            type: string
            example: <https://res.cloudinary.com/dhybvac8i/image/upload/v1719908534/zvsgkozogtrkdwgtzaep.jpg>
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
